name: Deploy Full Stack (Worker & Web UI)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 已经修改为 22，以满足前端包的要求

      # ==========================================
      # 第一阶段：配置并部署后端 Worker 和数据库
      # ==========================================
      - name: Install Worker Dependencies
        run: |
          cd worker
          npm install
          # 全局安装 jq 工具用于解析 JSON
          sudo apt-get install -y jq

      - name: Auto-create Infrastructure & Update Config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          
          echo "=== 1. 自动检查或创建 D1 数据库 ==="
          # 查询已有的 D1 列表
          D1_LIST=$(npx wrangler d1 list --json || echo "[]")
          D1_ID=$(echo "$D1_LIST" | jq -r '.[] | select(.name == "sub2api_db") | .uuid' | head -n 1)
          
          if [ -z "$D1_ID" ] || [ "$D1_ID" == "null" ]; then
            echo "未找到 sub2api_db，正在为你自动创建 D1 数据库..."
            D1_OUT=$(npx wrangler d1 create sub2api_db)
            # 从输出日志中截取真实的 ID
            D1_ID=$(echo "$D1_OUT" | grep 'database_id' | cut -d'"' -f2)
          fi
          echo "=> 最终使用的 D1 ID: $D1_ID"

          echo "=== 2. 自动检查或创建 KV 命名空间 ==="
          # 查询已有的 KV 列表
          KV_LIST=$(npx wrangler kv:namespace list || echo "[]")
          KV_ID=$(echo "$KV_LIST" | jq -r '.[] | select(.title | contains("CACHE_KV")) | .id' | head -n 1)
          
          if [ -z "$KV_ID" ] || [ "$KV_ID" == "null" ]; then
            echo "未找到 CACHE_KV，正在为你自动创建 KV 命名空间..."
            KV_OUT=$(npx wrangler kv:namespace create CACHE_KV)
            # 从输出日志中截取真实的 ID
            KV_ID=$(echo "$KV_OUT" | grep 'id =' | cut -d'"' -f2)
          fi
          echo "=> 最终使用的 KV ID: $KV_ID"
          
          if [ -z "$D1_ID" ] || [ -z "$KV_ID" ]; then
            echo "❌ 错误：无法获取 D1 或 KV 的 ID，请确认你的 Cloudflare API Token 是否勾选了 KV 和 D1 的编辑权限！"
            exit 1
          fi

          echo "=== 3. 动态替换配置文件占位符 ==="
          sed -i "s/sub2api-d1-id/$D1_ID/g" wrangler.toml
          sed -i "s/sub2api-kv-id/$KV_ID/g" wrangler.toml
          
          echo "✅ 配置文件替换成功，准备进行最终部署..."

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'

      # ==========================================
      # 第二阶段：打包并部署前端 Vue 项目到 Pages
      # ==========================================
      - name: Install & Build Frontend
        run: |
          cd frontend
          
          # 1. 全局安装 pnpm
          npm install -g pnpm
          
          # 2. 使用 pnpm 安装依赖 (添加了 --no-frozen-lockfile 解决冲突报错)
          pnpm install --no-frozen-lockfile
          
          # 3. 动态注入你截图中的后端 Worker 地址
          echo "VITE_API_URL=https://sub2api-worker.anm13216.workers.dev" >> .env
          echo "VITE_API_BASE=https://sub2api-worker.anm13216.workers.dev" >> .env
          
          echo "开始打包前端..."
          # 4. 使用 pnpm 执行打包
          pnpm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd frontend
          
          echo "正在自动部署前端到 Cloudflare Pages..."
          # 使用 wrangler 将 frontend/dist 目录一键发布。
          # 项目名设为 sub2api-web，如果没有会自动创建。
          npx wrangler pages deploy dist --project-name="sub2api-web"
